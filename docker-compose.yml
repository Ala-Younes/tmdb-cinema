version: '3.8'

services:
  # Development service
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_BASE_URL=${VITE_BASE_URL}
      - VITE_TMDB_API_KEY=${VITE_TMDB_API_KEY}
      - VITE_IMAGE_BASE_URL=${VITE_IMAGE_BASE_URL}
    command: npm run dev -- --host

  # Production service
  app-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped